- doc_uid: ACT-CONSTITUTION-1950
  doc_type: statute
  title: The Constitution of India
  source_authority: official
  source:
    name: Legislative Department, Ministry of Law and Justice, Government of India
    url: https://www.legislative.gov.in/static/uploads/2025/07/359f70a69695affb9d72f8393102bd2e.pdf
    landing_url: https://www.legislative.gov.in/document/constitution-of-india-in-english
    license: null   # not verified: no reuse statement was read for this host
    kind: manual_import   # this host 403s the pipeline's honest User-Agent; a person downloaded it
  local_file: acts/constitution_2025-11-11.pdf
  identity:
    pages: 5
    all_of: ["THE CONSTITUTION OF INDIA"]
  language: en
  document_status: in_force
  numbering: article
  act_name: Constitution of India
  act_year: 1950
  enactment_date: 1950-01-26     # commencement; well-established, not read from a notification page of this file
  period:
    valid_from: 2025-11-11
    basis: gazette_text
    note: >-
      valid_from is this document's own consolidation date ("As on 11th November, 2025" printed
      on its title page), NOT the original 1950 commencement. This is a single as-of-date
      compilation of a text amended ~106 times since 1950; the schema's one valid_from/valid_until
      per document cannot represent each Article's individual amendment history, so temporal
      queries about a specific Article before its own last amendment are NOT reliable against this
      document. Treat it as "current constitutional text as of Nov 2025" only.
  notes: >-
    799-page bilingual (Hindi + English) PDF; pages ~1-50 are Hindi front matter/preamble and
    extract as garbled text (a non-Unicode-mapped font) - harmless since only the English body
    (from PART I onward) is used. Structure differs from the 2023 Sanhitas: PART -> (Chapter) ->
    Article, with extensive tabular Schedules; see corpus reports/validation.json for what the
    current parser does and does not handle.
