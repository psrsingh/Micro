- doc_uid: ACT-ICA-1872
  doc_type: statute
  title: The Indian Contract Act, 1872 (Act No. 9 of 1872)
  source_authority: official
  source:
    name: India Code, Legislative Department, Ministry of Law and Justice, Government of India
    url: https://www.indiacode.nic.in/bitstream/123456789/2187/2/A187209.pdf
    landing_url: https://www.indiacode.nic.in/handle/123456789/2187
    license: null   # not verified: no reuse statement was read for this host
    kind: manual_import   # this host 403s the pipeline's honest User-Agent (checked 2026-09-25)
  local_file: acts/A187209.pdf
  identity:
    pages: 2
    all_of: ["THE INDIAN CONTRACT ACT, 1872", "ARRANGEMENT OF SECTIONS"]
  language: en
  document_status: in_force
  numbering: india_code
  strip_footnotes: true
  act_name: Indian Contract Act
  act_year: 1872
  act_number: 9 of 1872
  enactment_date: 1872-04-25     # printed under the long title: "[25th April, 1872.]"
  period:
    valid_from: 1872-09-01
    basis: gazette_text          # s. 1: "shall come into force on the first day of September, 1872"
    note: >-
      valid_from is the Act's own commencement, but this file is India Code's CONSOLIDATED text
      (amendments up to at least Act 34 of 2019, cited in its footnotes), with no as-of date
      printed on it. Sections amended since 1872 (e.g. 16, 19A, 28, 178, 178A) read as amended,
      so temporal queries about a provision before its own amendment are NOT reliable against
      this document. Chapters VII (sale of goods, ss. 76-123) and XI (partnership, ss. 239-266)
      are repealed; their one-line "Rep. by ..." stubs are indexed.
  notes: >-
    Replaces two copies the user downloaded into legalrag/ whose text had been converted to
    vector outlines (no text layer; 0 extractable characters). This copy has a real text layer; it
    was downloaded on 2026-09-25 from the url above with a one-off curl request (browser-style
    User-Agent), not by the pipeline, then imported (sha256 d756d45a...c59d, 568,075 bytes).
    Amendment footnotes are stripped at extraction (strip_footnotes); inline footnote markers
    ("1[India]", "writing2") stay in the text as printed. State amendments (e.g. Uttar Pradesh)
    printed inside a section are kept as part of that section. The Schedule (repealed) is not indexed.
