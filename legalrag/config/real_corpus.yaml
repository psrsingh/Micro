# Real Indian legal corpus (criminal law: BNS / BNSS / BSA 2023 + Supreme Court judgments).
# Database: a SEPARATE database (legalrag_real) so the synthetic fixture DB is untouched, and because the
# embedding model is pinned into the DB. Create it once:
#   docker exec legalrag-db psql -U legalrag -d legalrag -c "CREATE DATABASE legalrag_real"
# Needs:  uv pip install -e ".[ingest,ml]"
#
# GENERATOR: `fake` = plumbing only (no LLM is installed on this machine and no API key is configured).
# Retrieval, verification of hand-written claims and citation metrics are real; generated answers are not.
# Swap `llm:` for local_ollama's block (or provider: anthropic) to generate real answers.
name: real_corpus
seed: 1234

db:
  dsn: postgresql://legalrag:legalrag@127.0.0.1:5432/legalrag_real   # override with LEGALRAG_DSN

embedding:
  kind: sentence_transformers
  model: BAAI/bge-small-en-v1.5      # 384-d, 512-token window (MiniLM's 256 truncates 200-word legal chunks)
  dim: 384
  device: cpu
  batch_size: 16

llm:
  provider: fake
  model: fake-v1

corpus:
  corpus_dir: "~/legalrag_corpus"      # originals + extracted text; outside OneDrive. LEGALRAG_CORPUS_DIR overrides
  manifest_path: corpus/manifest.yaml
  source_allowlist:
    - www.mha.gov.in
    - indian-supreme-court-judgments.s3.ap-south-1.amazonaws.com
  download_min_interval_s: 1.0
  respect_robots_txt: true
  max_documents: 200
  ocr_enabled: false                   # needs pytesseract + the Tesseract binary (not installed here)
  statute_max_words: 220
  judgment_max_words: 220

retrieval:
  lexical_top_k: 100
  dense_top_k: 100
  fused_top_k: 50
  # pending_review and invalid documents can never be retrieved
  allowed_verification_statuses: [official_verified, supplementary_source]

rerank:
  kind: cross_encoder
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  device: cpu
  keep: 10

verify:
  kind: real
  enabled_checks: [authority, citation_metadata, statute, claim_support, temporal]
  min_verified_per_claim: 1
  include_flagged: true
  as_of: 2026-09-21
  support_judge: lexical               # fake generator cannot judge; use `llm` with a real generator
  lexical_can_verify: false            # word overlap is similarity, not entailment: it can flag, never verify
  judge_prompt: v2                     # (with support_judge: llm) direct-quote vs inferred-interpretation

pipeline:
  max_claims: 12
  abstain_on_unavailable_authority: true

eval:
  benchmark_path: legalrag/eval/data/benchmark_real.jsonl
  # AVA probes stay on the synthetic fixtures deliberately (see settings.EvalConfig.corpus_source):
  # they are a fixed regression suite over constructed cases, not a measurement of this corpus.
  probes_path: legalrag/eval/data/authority_probes_synthetic.jsonl
  corpus_source: db   # benchmark_real.jsonl's gold passages are validated against legalrag_real, not the fixtures
  recall_ks: [1, 3, 5, 10]
  audit_judge: lexical
  high_confidence: 0.8
