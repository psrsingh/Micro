# Everything real except the models: the full verification layer (authority, metadata, statute,
# temporal, claim support), the three-arm comparison and every metric run end to end, but the
# generator is a deterministic fake and retrieval uses hashed embeddings. The numbers prove the
# harness works; they say nothing about model quality. Needs Postgres, not a model download.
name: offline_demo
seed: 1234

embedding:
  kind: hash
  model: hash-bow-v1
  dim: 384

llm:
  provider: fake
  model: fake-v1
  temperature: 0.0
  seed: 1234

ingest:
  corpus_dir: legalrag/tests/fixtures/sample_corpus
  chunk_target_tokens: 200
  chunk_max_tokens: 400
  chunk_overlap_tokens: 40

retrieval:
  fused_top_k: 50

rerank:
  kind: lexical_fake
  keep: 10

verify:
  kind: real
  enabled_checks: [authority, citation_metadata, statute, claim_support, temporal]
  min_verified_per_claim: 1
  include_flagged: true
  as_of: 2026-09-20
  support_judge: lexical

eval:
  audit_judge: lexical
  recall_ks: [1, 3, 5, 10]
  high_confidence: 0.8
